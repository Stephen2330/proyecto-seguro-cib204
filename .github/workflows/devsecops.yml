# Pipeline DevSecOps - se ejecuta en GitHub Actions ante cada cambio.
name: Pipeline DevSecOps

on:
  push:
  pull_request:

jobs:

  # 1) Secretos (Gitleaks) + Analisis estatico del codigo (SAST, Semgrep)
  sast_secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
      - name: Analisis estatico (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

  # 2) Analisis de dependencias (SCA)
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: cd servidor && npm install
      - name: Auditar dependencias (npm audit)
        run: cd servidor && npm audit --audit-level=high || true
      - name: Escaneo de dependencias (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: servidor
          severity: HIGH,CRITICAL

  # 3) Construir la imagen, escanearla y generar el SBOM
  imagen:
    needs: [sast_secretos, sca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t cifrado:ci ./servidor
      - name: Escanear la imagen (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cifrado:ci
          severity: HIGH,CRITICAL
      - name: Generar SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: cifrado:ci

  # 4) DAST: probar la app en ejecucion con OWASP ZAP
  dast:
    needs: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar la app
        run: docker compose up -d --build cifrado
      - name: Esperar a que responda
        run: sleep 20
      - name: DAST con OWASP ZAP (baseline)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
