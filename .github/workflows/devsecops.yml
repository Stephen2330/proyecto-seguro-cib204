name: Pipeline DevSecOps
run-name: Sube material inseguro (Fase 1)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sast_semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Analizar código con Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan --config p/ci --error \
            --json-output semgrep-report.json /src

      - name: Guardar reporte de Semgrep
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reporte-semgrep
          path: semgrep-report.json
          if-no-files-found: warn

      - name: Marcar hallazgos de Semgrep
        if: always()
        run: |
          if [ "${{ steps.semgrep.outcome }}" != "success" ]; then
            exit 1
          fi

  sast_codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4

  secretos:
    name: Secretos - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Buscar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  sca:
    name: SCA - Dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar dependencias
        id: npm_ci
        continue-on-error: true
        working-directory: servidor
        run: npm ci

      - name: Ejecutar pruebas unitarias
        id: npm_test
        continue-on-error: true
        working-directory: servidor
        run: npm test -- --runInBand

      - name: Limpiar llaves temporales generadas por las pruebas
        if: always()
        working-directory: servidor
        run: rm -f clave_publica.pem clave_privada.pem

      - name: Revisar dependencias con Trivy
        id: trivy_fs
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: servidor
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Auditar dependencias con npm
        id: npm_audit
        if: always()
        continue-on-error: true
        working-directory: servidor
        run: npm audit --audit-level=high

      - name: Marcar fallos de SCA
        if: always()
        run: |
          if [[ "${{ steps.npm_ci.outcome }}" != "success" ||
                "${{ steps.trivy_fs.outcome }}" != "success" ||
                "${{ steps.npm_test.outcome }}" != "success" ||
                "${{ steps.npm_audit.outcome }}" != "success" ]]; then
            exit 1
          fi

  imagen:
    name: Imagen - Trivy + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Construir imagen
        id: build_image
        continue-on-error: true
        run: docker build --pull -t cifrado:ci ./servidor

      - name: Registrar ID de imagen para Trivy
        id: image_id
        if: steps.build_image.outcome == 'success'
        run: docker image inspect cifrado:ci --format 'TRIVY_IMAGE_ID={{.Id}}'

      - name: Escanear imagen con Trivy
        id: trivy_image
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cifrado:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Generar SBOM con Syft
        id: sbom
        if: always()
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cifrado:ci
          artifact-name: sbom-cifrado

      - name: Marcar fallos de imagen o SBOM
        if: always()
        run: |
          if [[ "${{ steps.build_image.outcome }}" != "success" ||
                "${{ steps.image_id.outcome }}" != "success" ||
                "${{ steps.trivy_image.outcome }}" != "success" ||
                "${{ steps.sbom.outcome }}" != "success" ]]; then
            exit 1
          fi

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Levantar API y Keycloak
        run: docker compose up -d --build cifrado

      - name: Esperar respuesta de la API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/salud >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Analizar con OWASP ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          artifact_name: reporte-zap
          allow_issue_writing: false
          fail_action: false

      - name: Detener servicios
        if: always()
        run: docker compose down --volumes